---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
  when: harden_unattended_upgrades

- name: Enable periodic update + upgrade
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  when: harden_unattended_upgrades

# Separate local drop-in for reboot policy so we don't clobber the distro's
# own 50unattended-upgrades file.
- name: Configure auto-reboot policy
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
  when: harden_unattended_upgrades
