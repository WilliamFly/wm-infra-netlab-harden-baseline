---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ harden_ufw_default_incoming }}"

- name: Set default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ harden_ufw_default_outgoing }}"

- name: Allow configured ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.from | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ harden_ufw_allowed_ports }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
